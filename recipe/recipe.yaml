# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"

package:
  name: openfeature-flagd-core
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/openfeature-flagd-core/openfeature_flagd_core-${{ version }}.tar.gz
  sha256: b416396949ee766f791ade3c5880fb15407b774349ee13b72f5e76ccfe932ca8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.0,<0.10.0
  run:
    - python >=${{ python_min }}
    - openfeature-flagd-api <2,>=1.0.0
    - openfeature-sdk >=0.8.2
    - mmh3 <6.0.0,>=5.0.0
    - panzi-json-logic ==1.0.1
    - semver <4,>=3
    - cbor2 <6.0.0,>=5.6.5

tests:
  - python:
      imports:
        - openfeature.contrib.tools.flagd.core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/open-feature/python-sdk-contrib
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenFeature flagd evaluator core implementation
  description: |
    OpenFeature flagd evaluator core implementation

extra:
  recipe-maintainers:
    - rxm7706
    - pb01ka
